services:
  - type: web
    name: football-intelligence
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: AILINDO_BASE_URL
        sync: false
      - key: AILINDO_API_KEY
        sync: false
      - key: AILINDO_MODEL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
